name: Deeplist Android APK

on:
  push:
    branches: [wordstorm-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordstorm-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Deeplist
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      METROLIST_APPLICATION_ID: com.deepu.wordstorm
      METROLIST_APP_NAME: Deeplist
      METROLIST_ABI_FILTERS: arm64-v8a
      METROLIST_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.wordstorm-signing/debug.keystore
    steps:
      - name: Check out custom source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: wordstorm-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: wordstorm-gradle-${{ runner.os }}-

      - name: Keep test-app signing key between builds
        uses: actions/cache@v4
        with:
          path: .wordstorm-signing
          key: wordstorm-test-signing-${{ github.repository }}-v1

      - name: Verify existing Deeplist update signing key
        shell: bash
        run: |
          if [ ! -f "$METROLIST_DEBUG_KEYSTORE_PATH" ]; then
            echo "Existing Deeplist signing key is missing. Restore its backup; generating a new key would prevent updating the installed app."
            exit 1
          fi
          CERT=$(keytool -exportcert -keystore "$METROLIST_DEBUG_KEYSTORE_PATH" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f1)
          test "$CERT" = "1c73c95916d7e14bac0533d0a4a20a3c01be78f066fcc0c1102254712c4bcd5d" || { echo "Signing certificate differs from the existing Deeplist app."; exit 1; }

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDK_MANAGER" --licenses < <(yes) >/dev/null
          "$SDK_MANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build APK and run unit tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 --no-parallel -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs="-Xmx3g -XX:ActiveProcessorCount=2" :app:assembleFossDebug :app:testFossDebugUnitTest
          ./gradlew --no-daemon --max-workers=1 --no-parallel -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs="-Xmx3g -XX:ActiveProcessorCount=2" :app:assembleFossRelease

      - name: Verify release identity and report tests
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, hashlib, os, subprocess, xml.etree.ElementTree as ET
          apks = glob.glob('app/build/outputs/apk/**/release/*.apk', recursive=True)
          assert len(apks) == 1, apks
          apk = apks[0]
          tools = os.path.join(os.environ['ANDROID_HOME'], 'build-tools', '36.0.0')
          cert = subprocess.check_output([tools + '/apksigner', 'verify', '--print-certs', apk], text=True)
          assert 'Signer #1 certificate SHA-256 digest: 1c73c95916d7e14bac0533d0a4a20a3c01be78f066fcc0c1102254712c4bcd5d' in cert
          badging = subprocess.check_output([tools + '/aapt', 'dump', 'badging', apk], text=True)
          assert "package: name='com.deepu.wordstorm'" in badging
          assert "application-label:'Deeplist'" in badging
          reports = [ET.parse(p).getroot() for p in glob.glob('app/build/test-results/testFossDebugUnitTest/TEST-*.xml')]
          assert reports and not any(int(r.get('failures', 0)) + int(r.get('errors', 0)) for r in reports)
          print('Unit tests passed:', sum(int(r.get('tests', 0)) for r in reports))
          print(cert)
          print('APK SHA256:', hashlib.sha256(open(apk, 'rb').read()).hexdigest())
          print('Release package and original Deeplist certificate verified.')
          PY

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Deeplist-APK
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Wordstorm-Build-Reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish reviewed Deeplist 158
    needs: apk
    if: github.ref == 'refs/heads/wordstorm-build'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Deeplist-APK
          path: apk
      - name: Publish versioned APK after successful checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import glob, hashlib, json, os, shutil, subprocess, datetime
          paths = glob.glob('apk/**/*.apk', recursive=True)
          assert len(paths) == 1, paths
          apk = paths[0]
          tools = os.path.join(os.environ['ANDROID_HOME'], 'build-tools')
          aapt = sorted(glob.glob(tools + '/*/aapt'))[-1]
          signer = sorted(glob.glob(tools + '/*/apksigner'))[-1]
          badging = subprocess.check_output([aapt, 'dump', 'badging', apk], text=True)
          assert "package: name='com.deepu.wordstorm' versionCode='158' versionName='13.7.5'" in badging
          cert = subprocess.check_output([signer, 'verify', '--print-certs', apk], text=True)
          fingerprint = '1c73c95916d7e14bac0533d0a4a20a3c01be78f066fcc0c1102254712c4bcd5d'
          assert 'Signer #1 certificate SHA-256 digest: ' + fingerprint in cert
          shutil.copyfile(apk, 'Deeplist.apk')
          changes = ['Google or Guest welcome and Spotify-style profiles. Google sign-in awaits server configuration.', 'App-user dashboard with approximate city/country, last active, app opens and admin block/unblock.', 'Profile editing, selected public collections, saved lyric moments and player fixes.']
          manifest = dict(packageId='com.deepu.wordstorm', versionName='13.7.5', versionCode=158, sizeBytes=os.path.getsize(apk), sha256=hashlib.sha256(open(apk,'rb').read()).hexdigest(), signingCertificateSha256=fingerprint, publishedAt=datetime.datetime.now(datetime.timezone.utc).isoformat(), downloadUrl='https://world.damndeepak.workers.dev/downloads/deeplist.apk', assetUrl='https://github.com/Damndeepak/Metrolist/releases/download/deeplist-158/Deeplist.apk', sourceCommit=os.environ['GITHUB_SHA'], changelog=changes)
          open('deeplist.json','w').write(json.dumps(manifest, indent=2) + '\n')
          open('release-notes.txt','w').write('\n'.join(changes))
          PYCODE
          gh release create deeplist-158 Deeplist.apk deeplist.json --target "$GITHUB_SHA" --title "Deeplist 13.7.5" --notes-file release-notes.txt
