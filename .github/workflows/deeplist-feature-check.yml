name: Deeplist feature checks
on:
  push:
    branches: [deeplist-agreed-updates]
permissions:
  contents: read
concurrency:
  group: deeplist-feature-checks
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      METROLIST_APPLICATION_ID: com.deepu.wordstorm.preview
      METROLIST_APP_NAME: Deeplist Preview
      METROLIST_ABI_FILTERS: arm64-v8a
      METROLIST_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/deeplist-preview.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deeplist-feature-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: wordstorm-gradle-${{ runner.os }}-
      - name: Create isolated preview signing key
        run: |
          keytool -genkeypair -noprompt -storetype JKS -keystore "$METROLIST_DEBUG_KEYSTORE_PATH" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Deeplist Preview"
      - name: Install Android SDK
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDK_MANAGER" --licenses < <(yes) >/dev/null
          "$SDK_MANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Compile debug and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 --no-parallel -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs="-Xmx3g -XX:ActiveProcessorCount=2" :app:assembleFossDebug :app:testFossDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Deeplist-feature-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deeplist-feature-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
