name: Publish verified Deeplist

on:
  workflow_run:
    workflows: [Deeplist Android APK, Wordstorm Android APK]
    types: [completed]
    branches: [wordstorm-build]

  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful custom Deeplist build run ID
        required: true
        default: "40280663837"
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve successful custom build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ github.event.workflow_run.id || inputs.build_run_id }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          run = os.environ['REQUESTED_RUN']
          assert re.fullmatch(r'\d+', run)
          repo = os.environ['GITHUB_REPOSITORY']
          source = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/actions/runs/' + run], text=True))
          assert source['conclusion'] == 'success' and source['head_branch'] == 'wordstorm-build'
          assert source['head_repository']['full_name'] == repo
          assert source['path'] == '.github/workflows/wordstorm-android.yml'
          assert re.fullmatch(r'[0-9a-f]{40}', source['head_sha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('run_id=' + run + '\nsha=' + source['head_sha'] + '\n')
          PYTHON
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: Deeplist-APK
          path: dist
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify public release identity
        id: verify
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, glob, hashlib, json, os, pathlib, re, shutil, subprocess
          apks = glob.glob('dist/**/*.apk', recursive=True)
          assert len(apks) == 1, apks
          apk = apks[0]
          tools = sorted(glob.glob(os.environ['ANDROID_HOME'] + '/build-tools/*'))[-1]
          cert = subprocess.check_output([tools + '/apksigner', 'verify', '--print-certs', apk], text=True)
          fingerprint = '1c73c95916d7e14bac0533d0a4a20a3c01be78f066fcc0c1102254712c4bcd5d'
          assert re.search(r'certificate SHA-256 digest:\s*' + fingerprint, cert, re.I), cert
          badging = subprocess.check_output([tools + '/aapt', 'dump', 'badging', apk], text=True)
          assert "package: name='com.deepu.wordstorm'" in badging
          assert "application-label:'Deeplist'" in badging
          assert 'application-debuggable' not in badging
          code = int(re.search(r"versionCode='(\d+)'", badging).group(1))
          version = re.search(r"versionName='([^']+)'", badging).group(1)
          assert code > 153 and re.fullmatch(r'\d+\.\d+\.\d+', version)
          tag = 'deeplist-' + str(code)
          shutil.copyfile(apk, 'Deeplist.apk')
          manifest = dict(packageId='com.deepu.wordstorm', versionName=version, versionCode=code,
              sizeBytes=os.path.getsize(apk), sha256=hashlib.sha256(pathlib.Path(apk).read_bytes()).hexdigest(),
              signingCertificateSha256=fingerprint, publishedAt=datetime.datetime.now(datetime.timezone.utc).isoformat(),
              downloadUrl='https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/releases/download/' + tag + '/Deeplist.apk',
              assetUrl='https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/releases/download/' + tag + '/Deeplist.apk',
              sourceCommit=os.environ['BUILD_SHA'],
              changelog=(['Faster live sharing: song changes, pause and seek wake the uploader immediately; remote-control requests no longer block state uploads.', 'Requires the matching website deployment. Sub-2-second phone-to-website latency has not been verified on a device.'] if code >= 157 else []) + (['Removed the separate Wasted demo entry. Existing Apple Music and Verci lyrics styles are unchanged.'] if code >= 156 else ['Added the website-style Wasted demo inside the app with the same scrolling, word highlight, moving blur and controls.'] if code == 155 else []) + ['Deeplist Discord branding and website buttons.',
                  'Retry failed and stale presence after reconnect; ignore stale song artwork.',
                  'Check for Deeplist updates and download from the public website.',
                  'Existing Apple, Verci, Neon and video features retained. Google cloud sync is not included.'])
          pathlib.Path('deeplist-release.json').write_text(json.dumps(manifest, indent=2) + '\n')
          pathlib.Path('notes.txt').write_text('\n'.join('- ' + line for line in manifest['changelog']) + '\n\nPackage and original signing certificate verified. Android install and another viewer\'s Discord profile still need device testing.\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('tag=' + tag + '\n' + 'title=Deeplist ' + version + '\n')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish public binary release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.source.outputs.sha }}
          TAG: ${{ steps.verify.outputs.tag }}
          TITLE: ${{ steps.verify.outputs.title }}
        shell: bash
        run: gh release create "$TAG" Deeplist.apk deeplist-release.json --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" --title "$TITLE" --notes-file notes.txt
