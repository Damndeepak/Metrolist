<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920"><title>Deeplist TV</title><link rel="stylesheet" href="style.css"></head>
<body><div id="backdrop"></div><header><strong>deeplist<span> TV</span></strong><span id="status" role="status">Connecting…</span></header>
<main><section class="record"><img id="cover" alt="Album artwork" hidden><h1 id="title">Your music. Bigger.</h1><p id="artist">Play a song in Deeplist with website sharing enabled.</p><div id="videoWrap" hidden><div id="youtube"></div></div></section>
<section class="lyrics" aria-label="Synced lyrics"><p id="previous"></p><p id="current">The room is quiet.</p><p id="next"></p></section></main>
<footer><div class="progress"><div id="fill"></div></div><div class="clock"><span id="position">0:00</span><span id="duration">0:00</span></div><nav><button id="choose">Choose player</button><button id="audio" disabled>Listen on TV</button></nav><p id="message" role="status">Select the player already connected to your Deeplist app.</p></footer>
<dialog id="directory"><h2>Choose your Deeplist</h2><div id="players"></div><button id="close">Back</button></dialog>
<script src="core.js"></script><script src="app.js"></script></body></html>
